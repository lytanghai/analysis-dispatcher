name: Query Gold Price

on:
  schedule:
    - cron: "*/2 * * * *"
#    # Monday 05:00 Cambodia → Tuesday 00:00 Cambodia
#    - cron: "0,30 22,23 * * 1"
#
#    # Tuesday → Thursday, all day
#    - cron: "0,30 * * * 2-4"
#
#    # Friday 00:00 Cambodia → Saturday 00:00 Cambodia
#    - cron: "0,30 * * * 5"
#
#    # Saturday 00:00 Cambodia → 04:00 Cambodia
#    - cron: "0,30 0-20 * * 6"

jobs:
  update-gold-price:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch gold price
        id: gold
        shell: bash
        run: |
          set -e

          URL="https://api.gold-api.com/price/XAU"
          MAX_RETRIES=5

          for ATTEMPT in $(seq 1 $MAX_RETRIES); do
            echo "Fetching gold price (attempt $ATTEMPT/$MAX_RETRIES)..."

            if RESPONSE=$(curl -fsS \
              --connect-timeout 10 \
              --max-time 30 \
              "$URL"); then

              echo "Gold API request successful."
              echo "$RESPONSE"

              SYMBOL=$(echo "$RESPONSE" | jq -r '.symbol')
              PRICE=$(echo "$RESPONSE" | jq -r '.price')

              echo "symbol=$SYMBOL" >> "$GITHUB_OUTPUT"
              echo "price=$PRICE" >> "$GITHUB_OUTPUT"

              exit 0
            fi

            echo "Gold API request failed."

            if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
              echo "Retrying in 5 seconds..."
              sleep 5
            fi
          done

          echo "Gold API failed after $MAX_RETRIES attempts."
          exit 1

      - name: Send gold price to Render
        shell: bash
        run: |
          set -e

          CALLBACK_URL="${{ secrets.GOLD_CALLBACK_URL }}"
          MAX_RETRIES=5

          PAYLOAD=$(cat <<EOF
          {
            "symbol": "${{ steps.gold.outputs.symbol }}",
            "price": ${{ steps.gold.outputs.price }}
          }
          EOF
          )

          echo "Sending gold price to Render..."
          echo "Payload: $PAYLOAD"

          for ATTEMPT in $(seq 1 $MAX_RETRIES); do
            echo "Render callback attempt $ATTEMPT/$MAX_RETRIES..."

            if curl -fsS \
              --connect-timeout 10 \
              --max-time 30 \
              -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"; then

              echo "Render callback successful."
              exit 0
            fi

            echo "Render callback failed."

            if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
              echo "Retrying in 5 seconds..."
              sleep 5
            fi
          done

          echo "Render callback failed after $MAX_RETRIES attempts."
          exit 1