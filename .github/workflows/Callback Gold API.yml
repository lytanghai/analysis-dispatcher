name: Query Gold Price

on:
  schedule:
    # Monday 05:00 → Friday 23:30 Cambodia
    # Cambodia UTC+7
    - cron: "0,30 22,23 * * 0" # Monday 05:00–06:30 Cambodia
    - cron: "0,30 * * * 1-4"   # Mon–Thu 07:00–23:30 Cambodia
    - cron: "0,30 17-23 * * 1-4" # Tue–Fri 00:00–06:30 Cambodia
    - cron: "0,30 * * * 5"     # Friday 07:00–23:30 Cambodia

  workflow_dispatch:

jobs:
  update-gold-price:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch gold price
        id: gold
        shell: bash
        run: |
          set -e

          RESPONSE=$(curl -fsS \
            --connect-timeout 10 \
            --max-time 30 \
            "https://api.gold-api.com/price/XAU")

          echo "Gold API response:"
          echo "$RESPONSE"

          SYMBOL=$(echo "$RESPONSE" | jq -r '.symbol')
          PRICE=$(echo "$RESPONSE" | jq -r '.price')

          echo "Symbol: $SYMBOL"
          echo "Price: $PRICE"

          echo "symbol=$SYMBOL" >> "$GITHUB_OUTPUT"
          echo "price=$PRICE" >> "$GITHUB_OUTPUT"

      - name: Send gold price to callback
        shell: bash
        run: |
          set -e

          PAYLOAD=$(cat <<EOF
          {
            "symbol": "${{ steps.gold.outputs.symbol }}",
            "price": ${{ steps.gold.outputs.price }}
          }
          EOF
          )

          echo "Sending to callback..."
          echo "Payload: $PAYLOAD"

          curl -fsS \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST "${{ secrets.GOLD_CALLBACK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

          echo "Callback successful."