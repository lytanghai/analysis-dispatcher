spring:
  application:
    name: dispatch.worker
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Phnom_Penh
  datasource:
    url: xxxx
    username: xxxxx
    password: xxxxx
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

custom:
  rest-client:
    enabled: true
    logging:
      enabled: true
    clients:
      default-connector:
        connect-timeout: 2000ms
        read-timeout: 5000ms
        connection-request-timeout: 2000ms
        ssl-enabled: false
        connection-pool:
          max-total: 200
          max-per-route: 100
          ttl: 300000ms
          validate-after-inactivity: 2000ms
          evict-idle-connections: 30000ms

public-url:
  xau-price: https://api.gold-api.com/price/XAU
  forex-factory: https://nfs.faireconomy.media/ff_calendar_thisweek.json